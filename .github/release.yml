changelog:
  categories:
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "Documentation & Maintenance"
      labels:
        - "documentation"
        - "maintenance"
        - "chore"
    - title: "Other Changes"
      labels:
        - "*"
  exclude:
    labels:
      - "skip-changelog"
    authors:
      - "dependabot[bot]"
