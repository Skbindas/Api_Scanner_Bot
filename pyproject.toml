[project]
name = "api-scanner-bot"
version = "2.0.0"
description = "Professional API Security Scanner with integrated analysis and reporting"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Suhaib Choudhary"}
]
dependencies = [
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "playwright>=1.35.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "tldextract>=3.4.0",
    "shodan>=1.29.1",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
api-scanner = "api_scanner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
